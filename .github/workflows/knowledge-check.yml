name: knowledge-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Knowledge store check
        env:
          # The checker comes from the public skills repository, pinned by commit,
          # so a pull request here cannot edit its own checker. It knows ORGANIZE 1.23.
          PIN: e31910bcd41cb8db8eff50fa66c5b181baae3d5f
        run: |
          curl -fsSL "https://raw.githubusercontent.com/jonhill90/skills/$PIN/skills/organize-repository/scripts/check_knowledge_store.py" \
            -o "$RUNNER_TEMP/check_knowledge_store.py"
          python3 -I "$RUNNER_TEMP/check_knowledge_store.py" .
